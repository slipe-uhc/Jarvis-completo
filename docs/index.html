<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis</title>
<meta name="theme-color" content="#05080d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#05080d;--tx:#e9f2fb;--mut:#8ea3b8;--ac:#8fd0ff;--ac2:#5aa9e6;--gl:rgba(255,255,255,.055);--bd:rgba(160,210,255,.14);--ok:#7fe0b0;--warn:#ffd27a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(90,169,230,.22),transparent 60%),radial-gradient(700px 500px at -10% 40%,rgba(143,208,255,.10),transparent 60%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(14px,env(safe-area-inset-left,0))}
#app{max-width:720px;margin:0 auto;padding:14px 0 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font-size:12px;letter-spacing:.28em;color:var(--ac);font-weight:600}
.date{font-size:22px;font-weight:600;margin-top:2px}.date::first-letter{text-transform:uppercase}
.lv{text-align:right;min-width:120px}
.lv b{font-size:13px;color:var(--ac)}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px;transition:width .4s}
.small{font-size:12px;color:var(--mut)}
.modes{display:flex;gap:6px;margin:14px 0 8px;flex-wrap:wrap}
button,.btn{font:inherit;color:var(--tx);cursor:pointer}
.mode{padding:6px 12px;border-radius:99px;background:var(--gl);border:1px solid var(--bd);font-size:13px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mode.on{border-color:var(--ac);color:var(--ac);background:rgba(143,208,255,.12)}
nav{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:8px 0 14px;overflow-x:auto}
nav button{background:none;border:0;padding:10px 12px;color:var(--mut);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--tx);border-bottom-color:var(--ac)}
.card{background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card h3{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);font-weight:600}
.hero .big{font-size:20px;font-weight:600}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-radius:12px;cursor:pointer}
.row+.row{border-top:1px solid rgba(160,210,255,.07)}
.row.cur{background:rgba(143,208,255,.09);outline:1px solid rgba(143,208,255,.25)}
.row.dn .tt{opacity:.45;text-decoration:line-through}
.ck{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(160,210,255,.45);display:grid;place-items:center;margin-top:1px;font-size:14px;line-height:1;color:#04121e}
.dn .ck{background:var(--ac);border-color:var(--ac)}
.tm{flex:none;width:44px;color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.tb{min-width:0;flex:1}
.tt{font-weight:500}
.dt{font-size:13px;color:var(--mut)}
.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);border:1px solid var(--bd);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.miss{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.miss.ok{color:var(--ok)}
.btn{display:inline-block;padding:9px 14px;border-radius:12px;background:rgba(143,208,255,.14);border:1px solid rgba(143,208,255,.35);color:var(--ac);text-decoration:none;font-size:14px}
.btn.ghost{background:var(--gl);border-color:var(--bd);color:var(--tx)}
.btn.red{color:#ff9d9d;border-color:rgba(255,157,157,.35);background:rgba(255,157,157,.08)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ex .exh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex .exh span{color:var(--ac);font-size:13px;white-space:nowrap}
.inp{display:flex;gap:10px;margin:10px 0}
.inp label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
input,textarea,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:100%}
.inp input{width:74px}
textarea{width:100%;min-height:150px;font-size:13px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:42px;height:42px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);font-size:15px}
.chip.on{background:var(--ac);color:#04121e;border-color:var(--ac);font-weight:600}
.rest{position:sticky;top:6px;z-index:5;display:none;justify-content:space-between;align-items:center;background:rgba(10,20,32,.85);border:1px solid var(--ac);border-radius:14px;padding:10px 14px;margin-bottom:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.rest b{font-size:22px;color:var(--ac);font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.pill{flex:none;min-width:58px;padding:8px 6px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);text-align:center;font-size:12px}
.pill.on{border-color:var(--ac);color:var(--ac)}
.pill .pc{font-size:11px;color:var(--mut)}
.log{max-height:260px;overflow:auto;font-size:14px}
.log div{padding:5px 0;border-bottom:1px solid rgba(160,210,255,.07)}
.log .me{color:var(--mut)}
.log .ja{color:var(--ac)}
.mic{width:100%;padding:16px;border-radius:16px;font-size:16px;background:rgba(143,208,255,.1);border:1px solid var(--ac);color:var(--ac)}
.mic.on{background:var(--ac);color:#04121e;font-weight:600}
form.cmd{display:flex;gap:8px;margin-top:10px}
form.cmd input{flex:1}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tg{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid var(--bd);position:relative}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:.2s}
.tg.on{background:rgba(143,208,255,.35);border-color:var(--ac)}
.tg.on::after{left:22px;background:var(--ac)}
ul.l{margin:6px 0;padding-left:18px;color:var(--mut);font-size:13px}
ul.l li{margin:3px 0}
code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(30px);opacity:0;transition:.3s;background:rgba(12,24,38,.92);border:1px solid var(--ac);border-radius:14px;padding:10px 16px;max-width:90vw;font-size:14px;z-index:20;pointer-events:none;backdrop-filter:blur(14px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){.date{font-size:26px}}

/* ===== estilo desktop Linux ===== */
body{background:radial-gradient(1000px 600px at 90% -10%,rgba(90,169,230,.25),transparent 60%),radial-gradient(800px 600px at -10% 50%,rgba(143,208,255,.12),transparent 60%),radial-gradient(600px 400px at 50% 110%,rgba(90,120,230,.15),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);z-index:0}
#app{position:relative;z-index:1}
header{position:sticky;top:max(6px,env(safe-area-inset-top,0));z-index:30;background:rgba(8,14,22,.55);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.brand{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace}
.date{font-size:18px}
.tm,.card h3,.chip,.rest b{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace}
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035));border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);animation:rise .35s both}
.card h3{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:.04em;font-size:12px;margin-bottom:10px}
.card h3::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff6b6b;box-shadow:15px 0 #ffd27a,30px 0 #7fe0b0;margin-right:36px;flex:none}
.row{transition:background .2s}.row:hover{background:rgba(143,208,255,.06)}
.ck{transition:.2s}.dn .ck{box-shadow:0 0 12px rgba(143,208,255,.6)}
.btn{transition:.15s}.btn:active,.chip:active,.mode:active{transform:scale(.96)}
.bar i{box-shadow:0 0 10px rgba(143,208,255,.7)}
.mic.on{animation:pulse 1.6s infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(143,208,255,.5)}50%{box-shadow:0 0 0 12px rgba(143,208,255,0)}}
@media(min-width:900px){
  #app{max-width:1120px;display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto auto 1fr;column-gap:18px;align-items:start}
  header{grid-column:1/-1}
  #modes{grid-column:1;flex-direction:column;margin:14px 0 6px}
  #modes .mode{text-align:left;border-radius:12px}
  #tabs{grid-column:1;flex-direction:column;border:0;margin:0;overflow:visible}
  #tabs button{text-align:left;border:1px solid transparent;border-radius:12px;padding:12px 14px;font-size:15px}
  #tabs button.on{background:rgba(143,208,255,.12);border-color:var(--bd);color:var(--ac)}
  #view{grid-column:2;grid-row:2/span 2;margin-top:14px}
}
</style>

function parseText(txt){
  var days=[[],[],[],[],[],[],[]],ex={},cur=-1,lastT='08:00',all=[],n=0,wkd={};
  var hr=/^(segunda|terca|quarta|quinta|sexta|sabado|domingo|seg|ter|qua|qui|sex|sab|dom)\b/;
  var idxOf={segunda:0,seg:0,terca:1,ter:1,quarta:2,qua:2,quinta:3,qui:3,sexta:4,sex:4,sabado:5,sab:5,domingo:6,dom:6};
  txt.split(/\r?\n/).forEach(function(raw){
    var line=raw.replace(/^\s*(?:[#>*\-+]+\s*)*(?:\[[ xX]\]\s*)?/,'').replace(/\*\*/g,'').trim();
    if(!line)return;
    var nl=norm(line).replace(/[:\-–—\s]+$/,'').trim();
    var tm=line.match(/^(\d{1,2})(?::|h)(\d{2})?\s*(?:[-–a]\s*\d{1,2}(?::|h)?\d{0,2})?\s*[-–—:]?\s*(.*)$/);
    if(!tm){
      if(/^(todos os dias|todo dia|diario|diaria)\b/.test(nl)&&nl.length<30){cur=-2;return}
      var h=nl.match(hr);if(h&&nl.length<45&&!/\d\s*[x×]\s*\d/.test(nl)){cur=idxOf[h[1]];return}
    }
    if(cur===-1)return;
    var title=line,t=null;
    if(tm){t=pad(Math.min(23,+tm[1]))+':'+pad(+(tm[2]||0));title=tm[3].trim()||'Item';lastT=t}
    var detail='',sp=title.split(/\s+[—–-]\s+/);
    var exm=title.match(/^(.*?)\s*[-–—:]?\s*(\d+)\s*[x×]\s*(\d+(?:\s*[-–a]\s*\d+)?|falha|m[aá]x\w*)/i);
    var targets=cur===-2?[0,1,2,3,4,5,6]:[cur];
    if(exm&&exm[1].trim().length>1){
      targets.forEach(function(di){var key='imp_'+di;(ex[key]=ex[key]||{name:'Treino de '+DN[di],t:t||lastT,list:[]}).list.push({n:exm[1].trim().replace(/[-–—:]+$/,'').trim(),s:+exm[2],r:exm[3].replace(/\s+/g,'')});if(t)ex[key].t=ex[key].t||t});
      n++;return}
    if(sp.length>1){title=sp[0];detail=sp.slice(1).join(' — ')}
    targets.forEach(function(di){days[di].push({id:'x'+di+'_'+lastT.replace(':','')+'_'+slug(title),t:t||lastT,title:title,d:detail,imp:/!|\*$/.test(raw)||/treino|dormir|acordar|almo[cç]o|janta|estud|ingl/i.test(title),snd:/treino|dormir|acordar/i.test(title),w:'',c:/ingl/i.test(title)?'en':/estud|aula|prova/i.test(title)?'study':/treino/i.test(title)?'train':''})});
    n++;
  });
  Object.keys(ex).forEach(function(key){
    var di=+key.split('_')[1],wid='imp'+di;
    wkd[wid]={name:ex[key].name,ex:ex[key].list};
    var ex0=days[di].find(function(i){return /^treino/i.test(i.title)&&!i.w});
    if(ex0){ex0.w=wid;ex0.imp=true;ex0.snd=true;ex0.c='train';if(!ex0.d)ex0.d=ex[key].list.length+' exercícios'}
    else days[di].push({id:'x'+di+'_'+ex[key].t.replace(':','')+'_treino',t:ex[key].t,title:'Treino',d:ex[key].list.length+' exercícios',imp:true,snd:true,w:wid,c:'train'});
  });
  days.forEach(function(a){a.sort(cmpT)});
  return {days:days,wk:wkd,count:n}}
function doImport(){

  if(!txt){toast('Cole a rotina primeiro');return}

    if(txt[0]==='{'){var j=JSON.parse(txt);if(!j.days||j.days.length!==7)throw new Error('JSON sem 7 dias');r={id:'c'+Date.now(),name:j.name||name,days:j.days,wk:j.wk||{}}}

function run(raw){
  var n=norm(raw).replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim(),m;
  logJ.push({w:'me',t:raw});

  if(!/ouvido/.test(n)){

    if(xm){var tgt=/(pc|computador|notebook)/.test(xm[1])?'pc':'celular',clean=raw.replace(/\s+(no|pro|para o|pra o)\s+\S+\s*$/i,'');
      if(tgt!==device()){logJ.pop();if(!S.pair){say('Faça a ligação PC e celular em Ajustes primeiro.');return}pubRaw({type:'cmd',to:tgt,text:clean});say('Mandei para o '+(tgt==='pc'?'PC':'celular'));return}
      raw=clean;n=norm(clean).replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim()}}
  if(/\byoutube\b/.test(n)||/\byou tube\b/.test(n)){
    m=n.match(/(?:pesquis\w*|busc\w*|procur\w*)\s+(?:por\s+)?(.+)$/);
    var q=m?m[1].replace(/\s+(no|pelo|na)\s+(youtube|you tube)$/,'').trim():'';
    if(q)openUrl('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'YouTube: '+q);
    else openUrl('https://www.youtube.com','YouTube');

  if(/spotify/.test(n)){openUrl('https://open.spotify.com','Spotify');say('Abrindo o Spotify');return}
  if((m=n.match(/modo\s+(silencioso|estudo|treino|normal)/))){setMode(m[1]);say('Modo '+m[1]+' ativado');return}
  if(/ouvido|ouvir (so|apenas)|so (ouvindo|ouve)/.test(n)&&/(pc|computador|notebook|celular|telefone|ambos|os dois)/.test(n)){
    var tg=/(pc|computador|notebook)/.test(n)?'pc':/(celular|telefone)/.test(n)?'celular':'ambos';
    S.ear=tg;save();if(NATIVE){try{NATIVE.setEar(tg)}catch(e){}}pubRaw({type:'ear',v:tg});
    say(tg==='ambos'?'Ouvindo nos dois aparelhos':'Agora só o '+(tg==='pc'?'PC':'celular')+' escuta. Em cada aparelho vale a escolha feita nele.');

    var cn=curNext();var it=cn.cur||cn.next;

  if(/(mostr|abr|ver|v[aá]\w*).*treino|treino de hoje|meu treino/.test(n)){S.tab='treino';save();render();var k=todayWk();say(k?'Treino de hoje: '+R().wk[k].name:'Hoje não tem treino marcado. Escolha um na aba Treino.');return}

    if(t2){if(!doneToday()[t2.id])toggle(t2.id);say('Marquei como feito: '+t2.title)}else say('Não há item pendente.');return}

  if(/(para|pare|parar)\s+(de\s+)?ouvir|desativ\w+\s+(a\s+)?voz/.test(n)){stopVoice();say('Parei de ouvir');return}
  if(/\bajuda\b|comandos/.test(n)){say('Posso abrir YouTube e pesquisar, mudar de modo, dizer o que fazer agora, abrir o treino, marcar feito e dizer seu XP.');return}
  if(/\b(oi|ola|e ai)\b/.test(n)){say('Estou aqui.');return}

function heard(t){

  $('#modes').innerHTML=MODES.map(function(m){return '<button class="mode'+(S.mode===m?' on':'')+'" data-a="mode" data-v="'+m+'">'+m[0].toUpperCase()+m.slice(1)+'</button>'}).join('');
  $('#tabs').innerHTML=TABS.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('');
}
function rowHtml(i,d,cur,ro){
  return '<div class="row'+(d[i.id]?' dn':'')+(cur&&cur.id===i.id?' cur':'')+'"'+(ro?'':' data-a="tog" data-v="'+i.id+'"')+'><div class="ck">'+(d[i.id]?'✓':'')+'</div><div class="tm">'+esc(i.t)+'</div><div class="tb"><div class="tt">'+esc(i.title)+(CAT[i.c]?'<span class="tag">'+CAT[i.c]+'</span>':'')+'</div>'+(i.d?'<div class="dt">'+esc(i.d)+'</div>':'')+(i.w&&!ro?'<div class="btns"><button class="btn" data-a="openw" data-v="'+i.w+'">Abrir treino</button></div>':'')+'</div></div>'}
function vHoje(){
  var it=items(),d=doneToday(),cn=curNext(),ms=missions(),total=it.length,dn=it.filter(function(i){return d[i.id]}).length;

  var f=cn.cur||cn.next;
  h+=f?'<div class="big">'+esc(f.title)+'</div><div class="dt">'+esc(f.t)+(f.d?' · '+esc(f.d):'')+'</div><div class="btns"><button class="btn" data-a="tog" data-v="'+f.id+'">'+(d[f.id]?'Desmarcar':'Marcar feito')+'</button>'+(f.w?'<button class="btn ghost" data-a="openw" data-v="'+f.w+'">Abrir treino</button>':'')+'</div>':'<div class="big">Tudo feito por hoje 🎉</div>';
  if(S.mode==='treino')h+='<div class="btns"><a class="btn ghost" href="https://open.spotify.com" target="_blank" rel="noopener">Abrir Spotify</a></div>';
  h+='</div><div class="card"><h3>Missões</h3>'+ms.map(function(m){return '<div class="miss'+(m.ok?' ok':'')+'"><span>'+(m.ok?'✓ ':'○ ')+esc(m.t)+'</span><span>'+m.p+'</span></div>'}).join('')+'<div class="small" style="margin-top:6px">'+dn+' de '+total+' itens feitos · '+DN[dayIdx()]+'</div></div>';
  h+='<div class="card"><h3>Checklist de '+DN[dayIdx()]+'</h3>'+it.map(function(i){return rowHtml(i,d,cn.cur)}).join('')+'</div>';

function vTreino(){
  var r=R(),keys=Object.keys(r.wk);
  if(!keys.length)return '<div class="card">Esta rotina não tem treino. Importe uma com linhas como <code>Agachamento 4x8-12</code>.</div>';
  var k=S.wkSel&&r.wk[S.wkSel]?S.wkSel:(todayWk()&&r.wk[todayWk()]?todayWk():keys[0]),w=r.wk[k],dk=dstr(),L=S.logs[dk]||{};
  var h='<div id="rest" class="rest"></div><div class="card"><h3>Treino</h3><select data-a="wsel">'+keys.map(function(x){return '<option value="'+x+'"'+(x===k?' selected':'')+'>'+esc(r.wk[x].name)+(x===todayWk()?' (hoje)':'')+'</option>'}).join('')+'</select><div class="btns"><a class="btn ghost" href="https://open.spotify.com" target="_blank" rel="noopener">Abrir Spotify</a></div></div>';
  w.ex.forEach(function(e,idx){
    var key=exKey(k,e),a=L[key]||[],ll=lastLog(key),dr=draft[key]||{};
    var kg=dr.kg!=null?dr.kg:(ll&&ll.kg||''),rp=dr.r!=null?dr.r:(ll&&ll.r||'');
    var chips='';for(var i=0;i<e.s;i++)chips+='<button class="chip'+(a[i]?' on':'')+'" data-a="set" data-k="'+k+'" data-x="'+idx+'" data-s="'+i+'">'+(i+1)+'</button>';
    h+='<div class="card ex"><div class="exh"><b>'+esc(e.n)+'</b><span>'+e.s+' × '+esc(e.r)+'</span></div>'+(e.s>1||/kg|peso/.test(e.n)?'<div class="inp"><label>kg <input type="number" inputmode="decimal" step="0.5" data-key="'+key+'" data-f="kg" value="'+esc(kg)+'"></label><label>reps <input type="number" inputmode="numeric" data-key="'+key+'" data-f="r" value="'+esc(rp)+'"></label></div>':'')+'<div class="sets">'+chips+'</div><div class="btns"><button class="btn ghost" data-a="vid" data-v="'+esc(e.n)+'">▶ Ver execução</button></div>'+(ll?'<div class="small" style="margin-top:8px">Última vez: '+(ll.kg?ll.kg+' kg × ':'')+(ll.r||'?')+'</div>':'')+'</div>'});
  return h}
function vSemana(){
  var sel=S.wsel==null?dayIdx():S.wsel,mon=new Date();mon.setDate(mon.getDate()-dayIdx());
  var h='<div class="pills">';
  for(var i=0;i<7;i++){var dd=new Date(mon);dd.setDate(mon.getDate()+i);h+='<button class="pill'+(sel===i?' on':'')+'" data-a="wday" data-v="'+i+'">'+DN[i].slice(0,3)+'<div class="pc">'+(dd<=new Date()?pct(i,dd)+'%':'—')+'</div></button>'}
  h+='</div><div class="card"><h3>'+DN[sel]+(sel===dayIdx()?' (hoje)':'')+'</h3>';
  var d=sel===dayIdx()?doneToday():{};
  h+=items(sel).map(function(i){return rowHtml(i,d,null,sel!==dayIdx())}).join('')+'</div>';
  return h}
function vJarvis(){
  var h='<div class="card"><h3>Jarvis</h3><button class="mic'+(S.voice?' on':'')+'" data-a="voice">'+(S.voice?'🎙 Ouvindo "Jarvis…" (toque para parar)':'🎙 Ativar escuta por voz')+'</button>';
  h+='<div class="small" style="margin-top:8px">Este aparelho: <b>'+device()+'</b> · Ouvido: <b>'+S.ear+'</b>'+(listensHere()?'':' (este aparelho não escuta)')+'</div>';
  h+='<div class="btns">'+['ambos','pc','celular'].map(function(e){return '<button class="btn'+(S.ear===e?'':' ghost')+'" data-a="ear" data-v="'+e+'">'+(e==='ambos'?'Nos dois':'Só '+(e==='pc'?'PC':'celular'))+'</button>'}).join('')+'</div>';
  h+='<form class="cmd" data-a="cmdform"><input id="cmd" placeholder="Digite: Jarvis, abre o YouTube e pesquise…" autocomplete="off"><button class="btn" type="submit">Enviar</button></form></div>';
  h+='<div class="card"><h3>Conversa</h3><div class="log">'+(logJ.length?logJ.slice().reverse().map(function(l){return '<div class="'+l.w+'">'+(l.w==='me'?'Você: ':'Jarvis: ')+esc(l.t)+(l.link?' <a href="'+esc(l.link)+'" target="_blank" rel="noopener" style="color:var(--ac)">abrir</a>':'')+'</div>'}).join(''):'<div class="small">Nada ainda. Fale ou digite um comando.</div>')+'</div></div>';
  h+='<div class="card"><h3>Comandos</h3><ul class="l"><li>"Jarvis, abre o YouTube e pesquise Douglas Sola"</li><li>"Jarvis, o que eu faço agora?"</li><li>"Jarvis, mostra o treino"</li><li>"Jarvis, marca como feito"</li><li>"Jarvis, modo estudo / treino / silencioso / normal"</li><li>"Jarvis, abre o Spotify"</li><li>"Jarvis, quanto XP eu tenho?"</li><li>"Jarvis, troque o ouvido para PC / celular / ambos"</li></ul><div class="small">Dica: diga só "Jarvis" e espere o "Pois não?" antes do comando. A escuta funciona com o app aberto (aba ou janela instalada).</div></div>';
  return h}
function vAjustes(){
  var perm=('Notification' in window)?Notification.permission:'indisponível';
  var h='<div class="card"><h3>Avisos</h3>'+
  '<div class="sw"><span>Notificações dos itens principais</span><button class="tg'+(S.notif?' on':'')+'" data-a="ntf" aria-label="notificações"></button></div>'+
  '<div class="sw"><span>Sons</span><button class="tg'+(S.sound?' on':'')+'" data-a="snd" aria-label="sons"></button></div>'+
  '<div class="small">Permissão do navegador: <b>'+perm+'</b></div><div class="btns"><button class="btn" data-a="perm">Permitir notificações</button><button class="btn ghost" data-a="test">Testar aviso</button></div>'+
  '<div class="small" style="margin-top:8px">Silencioso: sem som. Estudo: só estudo e inglês. Treino: só treino. Só os itens principais avisam.</div></div>';
  h+='<div class="card"><h3>Rotinas</h3>'+routines().map(function(r){return '<div class="sw"><span>'+esc(r.name)+(r.id===S.cur?' <span class="tag">ativa</span>':'')+'</span><span>'+(r.id!==S.cur?'<button class="btn ghost" data-a="use" data-v="'+r.id+'">Usar</button> ':'')+(r.id!=='padrao'?'<button class="btn red" data-a="del" data-v="'+r.id+'">Excluir</button>':'')+'</span></div>'}).join('')+'</div>';
  h+='<div class="card"><h3>Importar rotina</h3><input id="impname" placeholder="Nome (ex.: Férias)" style="width:100%;margin-bottom:8px"><textarea id="imp" placeholder="Segunda&#10;07:00 Acordar&#10;08:00 Treino&#10;Flexão 4x10-15&#10;Barra fixa 4x8&#10;&#10;Terça&#10;..."></textarea><div class="btns"><button class="btn" data-a="import">Importar texto</button><label class="btn ghost">Abrir arquivo<input type="file" id="file" accept=".txt,.md,.json" hidden></label></div><ul class="l"><li>Títulos de dia: Segunda, Terça… (ou "Todos os dias")</li><li>Itens: <code>06:30 Título — detalhe</code></li><li>Exercícios: <code>Nome 4x8-12</code> viram a aba Treino do dia</li><li>Também aceita o JSON exportado por este app</li></ul></div>';
  h+=vLink();
  h+='<div class="card"><h3>Dados</h3><div class="btns"><button class="btn ghost" data-a="export">Exportar rotina ativa (JSON)</button><button class="btn ghost" data-a="backup">Exportar backup completo</button>'+(window._inst?'<button class="btn" data-a="install">Instalar app</button>':'')+'</div></div>';
  h+='<div class="card"><h3>Como funciona</h3><ul class="l"><li>Celular (app instalado): escuta "Jarvis" em segundo plano, mesmo com o app fechado, e avisa nos horários.</li><li>PC (app instalado pelo Edge/Chrome): escuta com a janela aberta ou minimizada. Ative "iniciar com o Windows" em edge://apps.</li><li>Depois de reiniciar o celular, abra o Jarvis uma vez para religar a escuta.</li><li>PC e celular se falam pelo código de ligação.</li></ul></div>';
  return h}
var VIEWS={hoje:vHoje,treino:vTreino,semana:vSemana,jarvis:vJarvis,ajustes:vAjustes};
function render(){
  try{head();$('#view').innerHTML=(VIEWS[S.tab]||vHoje)();if(S.tab==='treino')tickRest()}
  catch(e){$('#view').innerHTML='<div class="card">Erro ao desenhar: '+esc(e.message)+'</div>'}}

/* ========= eventos ========= */
function download(name,obj){try{var b=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},500)}catch(e){toast('Não consegui exportar')}}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el||el.tagName==='FORM'||el.tagName==='SELECT')return;
  var a=el.dataset.a,v=el.dataset.v;
  if(a==='tab'){S.tab=v;save();render();window.scrollTo(0,0)}
  else if(a==='mode')setMode(v);
  else if(a==='tog')toggle(v);
  else if(a==='openw'){S.wkSel=v;S.tab='treino';save();render();window.scrollTo(0,0)}
  else if(a==='set')setToggle(el.dataset.k,+el.dataset.x,+el.dataset.s);
  else if(a==='skip'){rest.end=0;tickRest()}
  else if(a==='wday'){S.wsel=+v;render()}
  else if(a==='voice'){if(S.voice)stopVoice();else startVoice()}
  else if(a==='ear'){run('troque o ouvido para '+v)}
  else if(a==='ntf'){S.notif=!S.notif;save();render()}
  else if(a==='snd'){S.sound=!S.sound;save();render()}
  else if(a==='perm'){if(NATIVE){NATIVE.askPerms();return}if(!('Notification' in window)){toast('Este navegador não tem notificações');return}Notification.requestPermission().then(function(p){toast('Permissão: '+p);render()})}
  else if(a==='test'){if(NATIVE){NATIVE.notifyTest();return}var n=S.notif;S.notif=true;notify('Teste do Jarvis','Se você viu isso, os avisos funcionam',true);S.notif=n}
  else if(a==='use'){S.cur=v;save();render()}
  else if(a==='del'){S.rs=S.rs.filter(function(r){return r.id!==v});if(S.cur===v)S.cur='padrao';save();render()}
  else if(a==='import')doImport();
  else if(a==='vid'){openUrl('https://www.youtube.com/results?search_query='+encodeURIComponent(v+' execução correta'),'Vídeo: '+v)}
  else if(a==='pairsave'){var pv=($('#pair').value||'').trim().toLowerCase().replace(/[^a-z0-9-]/g,'');if(pv.length<6){toast('Código curto demais (mín. 6)');return}S.pair='jv-'+pv;save();if(NATIVE){try{NATIVE.setPair(S.pair)}catch(e){}}else subStart();render();toast('Ligação salva')}
  else if(a==='pairgen'){$('#pair').value='jarvis-'+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6)}
  else if(a==='nperm'&&NATIVE)NATIVE.askPerms();
  else if(a==='nover'&&NATIVE)NATIVE.askOverlay();
  else if(a==='nexact'&&NATIVE)NATIVE.askExact();
  else if(a==='nbat'&&NATIVE)NATIVE.askBattery();
  else if(a==='export'){var r=R();download('rotina-'+slug(r.name)+'.json',{name:r.name,days:r.days,wk:r.wk})}
  else if(a==='backup')download('jarvis-backup.json',S);
  else if(a==='install'&&window._inst){window._inst.prompt();window._inst=null}
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.a==='wsel'){S.wkSel=el.value;save();render()}
  else if(el.id==='file'&&el.files[0]){var fr=new FileReader();fr.onload=function(){$('#imp').value=fr.result;toast('Arquivo carregado: toque em Importar texto')};fr.readAsText(el.files[0])}
});
document.addEventListener('input',function(ev){var el=ev.target;if(el.dataset&&el.dataset.key){var d=draft[el.dataset.key]=draft[el.dataset.key]||{};d[el.dataset.f]=el.value}});
document.addEventListener('submit',function(ev){
  var f=ev.target;if(f.dataset&&f.dataset.a==='cmdform'){ev.preventDefault();var i=$('#cmd'),t=i.value.trim();if(!t)return;i.value='';
    var m=norm(t).match(/\bjarvis\b[, ]*(.*)$/);run(m&&m[1]?m[1]:t);render()}});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._inst=e;if(S.tab==='ajustes')render()});

/* ========= ligação PC <-> celular ========= */
function vLink(){
  var h='<div class="card"><h3>Ligação PC e celular</h3><div class="small">Use o mesmo código nos dois aparelhos (só você deve saber).</div><input id="pair" placeholder="código, ex.: jarvis-9f3k2a" value="'+esc((S.pair||'').replace(/^jv-/,''))+'" style="width:100%;margin:8px 0"><div class="btns"><button class="btn" data-a="pairsave">Salvar código</button><button class="btn ghost" data-a="pairgen">Gerar código</button></div><div class="small" style="margin-top:6px">'+(S.pair?'Ligado ✓':'Sem ligação')+'</div></div>';
  if(NATIVE)h+='<div class="card"><h3>Permissões do celular</h3><div class="small">Faça os 4 passos uma vez, para o Jarvis ouvir e abrir apps com o app fechado.</div><div class="btns"><button class="btn" data-a="nperm">1. Microfone e avisos</button><button class="btn" data-a="nover">2. Aparecer sobre outros apps</button><button class="btn" data-a="nexact">3. Alarmes exatos</button><button class="btn" data-a="nbat">4. Sem limite de bateria</button></div></div>';
  return h}
function pubRaw(o){
  if(!S.pair)return;o.from=device();var m=JSON.stringify(o);
  if(NATIVE){try{NATIVE.publish(m)}catch(e){}return}
  try{fetch('https://ntfy.sh/'+S.pair,{method:'POST',body:m}).catch(function(){})}catch(e){}}
var es=null;
function subStart(){
  if(NATIVE||!S.pair)return;
  try{if(es)es.close();es=new EventSource('https://ntfy.sh/'+S.pair+'/sse');
    es.onmessage=function(e){try{var d=JSON.parse(e.data);if(d.event==='message')remote(JSON.parse(d.message))}catch(x){}}}catch(e){}}
function applyEvent(o){
  if(!o||!o.type)return;
  if(o.type==='ear')S.ear=o.v;
  else if(o.type==='mode')S.mode=o.v;
  else if(o.type==='voice')S.voice=!!o.v;
  else if(o.type==='done'){var dd=S.done[o.date]=S.done[o.date]||{};if(o.xp)dd[o.id]=o.xp;else delete dd[o.id]}
  else return;
  try{localStorage.setItem('jarvis_v1',JSON.stringify(S))}catch(e){}
  render()}
function remote(o){
  if(!o||o.from===device())return;
  if(o.type==='cmd'){if(o.to===device()||o.to==='all')run(o.text);return}
  applyEvent(o);
  if(o.type==='ear'&&!NATIVE&&S.voice){if(listensHere())startVoice();else stopVoice(true)}}
function pullNative(){if(!NATIVE)return;var a=[];try{a=JSON.parse(NATIVE.pull()||'[]')}catch(e){}a.forEach(applyEvent)}
window.pullNative=pullNative;
window.goTab=function(t){S.tab=t;save();render()};
if(NATIVE){try{var st=JSON.parse(NATIVE.getState());S.voice=!!st.voice;if(st.mode)S.mode=st.mode;if(st.ear)S.ear=st.ear;if(st.pair)S.pair=st.pair;else if(S.pair)NATIVE.setPair(S.pair)}catch(e){}
  setInterval(pullNative,2500)}
else subStart();
if(DESK){DESK.onHeard(function(t){heard(t)});DESK.onStatus(function(t){toast(t)})}

/* ========= início ========= */
render();
setInterval(tick,15000);tick();
setInterval(function(){tickRest();var a=document.activeElement;if(S.tab==='hoje'&&(!a||a===document.body))render();else head()},30000);
setInterval(tickRest,500);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
if(!NATIVE&&S.voice&&listensHere()){setTimeout(function(){try{startVoice()}catch(e){}},600)}
