name: Gerar EXE do Jarvis (PC)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copiar a interface para dentro do app
        shell: bash
        run: |
          mkdir -p pc/app
          cp docs/index.html pc/app/index.html

      - name: Instalar e compilar
        working-directory: pc
        shell: bash
        run: |
          npm install
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-PC
          path: pc/dist/Jarvis-PC-Setup.exe

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ github.run_number }}
          name: Jarvis PC v${{ github.run_number }}
          files: pc/dist/Jarvis-PC-Setup.exe
